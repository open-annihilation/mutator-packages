oamut: 1
id: "wg-fortress"
name: "WG Fortress"
version: "1"
author:
  name: "Immerman"
description: "The gates are the only units that make or store resources. Gate energy is the Normal gate's energy. Metal is a fiftieth of that. The Easy gate makes 1.2 times both, as a whole number. Both gates store a billion energy and a billion metal. Every other income and storage is zero, including a solar collector's negative energy use.\n\nFrugal is 1000, Moderate is 5000 and Wealthy is 15000. The three originals were written so that combining them averages their production. 3000 is Frugal with Moderate. 7000 is all three.\n\nThis package replaces WG - Fortress -- Frugal v.2, WG - Fortress -- Moderate v.2 and WG - Fortress -- Wealthy v.2, all by Immerman. MakesEnergy is left out, because no unit has that field. The gates keep their income, as they did in TA: Mutation. TA: Mutation never applied the originals' energy-use block, so solar collectors kept producing there. This package zeroes them, as the authors meant."
tags: ["economy", "gameplay"]
works-with: ["*"]
requires:
  engine: ">= 0.8.5"
  mutators: ["warpgate"]
layers: ["units"]
options:
  income:
    type: number
    min: 1000
    max: 15000
    step: 500
    default: 5000
    label: "Gate energy"
legacy:
  - name: "WG - Fortress -- Frugal v.2"
    prefix: "{}"
    compatibility: ["*"]
    files: ["{}WG-FortressFrugal2.tam", "{}WG-FortressFrugal2.sm"]
  - name: "WG - Fortress -- Moderate v.2"
    prefix: "{}"
    compatibility: ["*"]
    files: ["{}WG-FortressModerate2.tam", "{}WG-FortressModerate2.sm"]
  - name: "WG - Fortress -- Wealthy v.2"
    prefix: "{}"
    compatibility: ["*"]
    files: ["{}WG-FortressWealthy2.tam", "{}WG-FortressWealthy2.sm"]
