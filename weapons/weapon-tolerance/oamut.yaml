oamut: 1
id: "weapon-tolerance"
name: "Weapon Tolerance"
version: "1"
author:
  name: "Unknown"
description: "A weapon a unit fires, and that has no tolerance of its own, is given a tolerance of 500. Blasts nothing fires keep none: death explosions, mine blasts and meteors.\n\nThe files credit no one. Weapon Tolerance shipped as a hard mutator of 65 Uberhack weapon files. Each file replaced the whole weapon, so every other field came from Uberhack. The Core Scorpion's file left CORSCORP_WEAPON without a tolerance.\n\nThis package sets only the tolerance, on any mod, for a weapon named by weapon 1, 2 or 3 that does not already have one. Against the original's files on 3.1c, the rule also gives 500 to ARMAIR2AIRLASER, CORAIR2AIRLASER and ARM_BATS, which the Uberhack set has no section for, and to CORSCORP_WEAPON. The original gave CORBOMB and CORADVBOMB 500 and left ARMBOMB and ARMADVBOMB without one; this rule gives all four 500."
tags: ["statistics"]
works-with: ["*"]
requires:
  engine: ">= 0.8.5"
layers: ["weapons"]
legacy:
  - name: "Weapon Tolerance"
    prefix: "}{"
    compatibility: ["UH"]
    files: ["}{Tolerance.tam", "}{Tolerance.ccx"]
