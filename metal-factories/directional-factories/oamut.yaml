oamut: 1
id: "directional-factories"
name: "Directional Factories"
version: "1"
author:
  name: "Duct_Taper"
description: "Factories that face east, west or north, in any game.\n\nThis package replaces Directional Factories by Duct_Taper. Builders find the new plants on a page of their own, because the original's build pages are protected. Their buttons draw without pictures. On a mod that already has these plants, such as Uberhack, the package's 2001 copies replace the mod's. The original's Armlatnk.TDF overwrote 3.1c's file of that name and took the Panther (ARMLATNK) off the Arm advanced vehicle plant's third page; this package does not."
tags: ["new-units", "gameplay"]
works-with: ["*"]
requires:
  engine: ">= 0.8.5"
clashes: "replace"
layers: ["files", "menus"]
legacy:
  - name: "Directional Factories"
    prefix: "}{"
    compatibility: ["TACC", "BF", "DTH"]
    files: ["}{DirFact.tam", "}{DirFact.ccx"]
