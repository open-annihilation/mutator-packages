oamut: 1
id: "fortified-forts"
name: "Fortified Forts"
version: "1"
author: { name: "MAC (macraig)" }
description: "Static weapon structures and dragon's teeth take more punishment. A fort or a water weapon, with no metal, energy or extractor in its category and with hit points other than zero, has those hit points multiplied by 7, up to 30000, when it has no damage modifier or the modifier sits outside 0.00000001 to 1. A modifier inside that range is multiplied by 0.07 instead. Dragon's teeth that block movement, have a height and are not reclaimed on their own have their damage multiplied by 20, from 1 to 30000.\n\nThe original's text says ten times. Its rule multiplies hit points by seven, and this version keeps the rule. Fortified Forts & Walls, by MAC (macraig), treated a missing damage modifier as 1, so the structures without one were left as they were. This version gives those structures the sevenfold hit points the original meant. The teeth are taken from every feature folder."
tags: ["statistics"]
works-with: ["*"]
requires:
  engine: ">= 0.8.5"
layers: ["units", "features"]
legacy:
  - name: "[MAC] Fortified Forts & Walls"
    prefix: "{}"
    compatibility: ["*"]
    files: ["{}MAC Fortified Forts & Walls.tam", "{}MAC Fortified Forts & Walls.sm"]
