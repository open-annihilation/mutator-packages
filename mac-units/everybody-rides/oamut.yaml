layers: ["units"]
legacy:
  - name: "[MAC] Everybody Rides The Bus"
    prefix: "{}"
    compatibility: ["*"]
    files: ["{}MAC Everybody Rides The Bus.tam", "{}MAC Everybody Rides The Bus.sm"]
