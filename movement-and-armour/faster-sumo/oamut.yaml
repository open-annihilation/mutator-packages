description: "The Sumo moves and turns far faster than in the base game.\n\nDominic Ascione's Faster Sumo names CORSUMO and sets its top speed to 5 and its turn rate to 666, about fifteen times 3.1c's speed of 0.34. The original wrote the two values as two blocks.\n\nThe curated version names CORSUMO once and keeps both absolute values."
