oamut: 1
id: "seaplane-platform-speed"
name: "Seaplane Platform Speed"
version: "1"
author:
  name: "Drinken"
description: "The Arm and Core seaplane platforms build faster.\n\nDrinken's SeaplanePlatform_WTx1,5, SeaplanePlatform_WTx2 and SeaplanePlatform_WTx4 multiply worker time on ARMPLAT and CORPLAT, the units those originals name. Their notes invite combining them. A factor of 3 is the 1.5 and 2 files together.\n\nThis package is one build-speed setting from 1 to 8 in steps of 0.5."
tags: ["economy"]
works-with: ["*"]
requires:
  engine: ">= 0.8.5"
layers: ["units"]
options:
  factor:
    type: "number"
    min: 1
    max: 8
    step: 0.5
    default: 2
    label: "Build speed"
legacy:
  - name: "SeaplanePlatform_WTx1,5"
    prefix: "{}"
    compatibility: ["UH"]
    files: ["{}SPP_WTx1,5.tam", "{}SPP_WTx1,5.sm"]
  - name: "SeaplanePlatform_WTx2"
    prefix: "{}"
    compatibility: ["UH"]
    files: ["{}SPP_WTx2.tam", "{}SPP_WTx2.sm"]
  - name: "SeaplanePlatform_WTx4"
    prefix: "{}"
    compatibility: ["UH"]
    files: ["{}SPP_WTx4.tam", "{}SPP_WTx4.sm"]
