id: "everybody-rides"
name: "Everybody Rides the Bus"
version: "1"
author: { name: "MAC (macraig)" }
description: "A unit that was forbidden from transports can ride in one large enough to carry it.\n\nEverybody Rides The Bus, by MAC (macraig), removes the transport prohibition where it is set. This package replaces that original and keeps that rule."
